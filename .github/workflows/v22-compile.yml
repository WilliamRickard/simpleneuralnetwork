name: v22 compile

on:
  pull_request:
    paths:
      - 'v22/**'
      - 'v21/**'
      - '.github/workflows/v22-compile.yml'
  push:
    paths:
      - 'v22/**'
      - 'v21/**'
      - '.github/workflows/v22-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v22/main.cpp -o /tmp/v22-portable
      - name: Accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v22/main.cpp -lmvec -o /tmp/v22-accelerated
