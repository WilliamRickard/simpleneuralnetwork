name: v17 compile validation

on:
  push:
    branches: [v17-persistent-workers]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v17/main.cpp -o /tmp/simple_nn_v17_portable
      - name: Compile accelerated production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v17/main.cpp -lm -o /tmp/simple_nn_v17_accelerated
