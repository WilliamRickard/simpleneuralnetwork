name: v29 benchmark

# Shell-only workflow because this repository's Actions policy rejects external `uses:` steps.
on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - 'v29/**'
      - '.github/workflows/v29-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: CPU capabilities
        run: lscpu

      - name: Apply inherited-main wrapper candidate in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v29/main.cpp')
          s = p.read_text()
          old = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\nstatic int (*const v29_keep_v27_embedded_main)() __attribute__((unused)) = &v27_embedded_main;\n#endif\n'''
          if old not in s:
              raise SystemExit('expected v29 include prologue not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- v29/main.cpp

      - name: Strict portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp v29/main.cpp -o /tmp/v29-portable

      - name: Strict accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v29/main.cpp -lmvec -o /tmp/v29-accelerated

      - name: Production evaluator exactness benchmark
        run: |
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC \
            v29/benchmark/evaluator_exactness_benchmark.cpp -lmvec -o /tmp/v29-evaluator-exact
          /tmp/v29-evaluator-exact

      - name: Full training matrix
        env:
          OMP_PROC_BIND: 'true'
          OMP_PLACES: cores
          OMP_DYNAMIC: 'false'
        run: python3 v29/benchmark/run_full_training.py --pairs 7 --threads 4 --cooldown-ms 200 --output /tmp/v29-full-training.csv

      - name: Show matrix results
        if: always()
        run: |
          echo '--- v29 full training CSV ---'
          cat /tmp/v29-full-training.csv || true
          echo '--- end CSV ---'
