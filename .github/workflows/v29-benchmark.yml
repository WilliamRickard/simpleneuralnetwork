name: v29 benchmark

# This workflow intentionally avoids marketplace actions because the repository
# Actions policy permits shell steps but currently rejects external `uses:` steps.
on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - 'v29/**'
      - '.github/workflows/v29-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: CPU capabilities
        run: lscpu
      - name: Validate v29 inherited-main prologue fix in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('v29/main.cpp')
          text = path.read_text()
          old = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#define v27_embedded_main __attribute__((used)) v27_embedded_main\n#endif\n#include "../v28/main.cpp"\n#if defined(__GNUC__)\n#undef v27_embedded_main\n#endif\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          if old not in text:
              raise SystemExit('expected v29 include prologue not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff -- v29/main.cpp
      - name: Portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v29/main.cpp -o /tmp/v29-portable
      - name: Accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v29/main.cpp -lmvec -o /tmp/v29-accelerated
      - name: Production evaluator exactness benchmark
        run: |
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC \
            v29/benchmark/evaluator_exactness_benchmark.cpp -lmvec -o /tmp/v29-evaluator-exact
          /tmp/v29-evaluator-exact
      - name: Full training matrix
        env:
          OMP_PROC_BIND: 'true'
          OMP_PLACES: cores
          OMP_DYNAMIC: 'false'
        run: python3 v29/benchmark/run_full_training.py --pairs 7 --threads 4 --cooldown-ms 200 --output /tmp/v29-full-training.csv
      - name: Show matrix results
        if: always()
        run: |
          echo '--- v29 full training CSV ---'
          cat /tmp/v29-full-training.csv || true
          echo '--- end CSV ---'
