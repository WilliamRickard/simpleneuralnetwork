name: v29 wrapper diagnostics

on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - '.github/workflows/v29-benchmark.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: A - used pointer reference
        continue-on-error: true
        run: |
          cp v29/main.cpp /tmp/v29-main.orig
          trap 'cp /tmp/v29-main.orig v29/main.cpp' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v29/main.cpp'); s=p.read_text()
          old='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n__attribute__((used))\n#endif\nstatic int (*const v29_keep_v27_embedded_main)() = &v27_embedded_main;\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v29/main.cpp -o /tmp/v29-A

      - name: B - unused redeclaration
        continue-on-error: true
        run: |
          cp v29/main.cpp /tmp/v29-main.orig
          trap 'cp /tmp/v29-main.orig v29/main.cpp' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v29/main.cpp'); s=p.read_text()
          old='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\nstatic int v27_embedded_main() __attribute__((unused));\n#endif\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v29/main.cpp -o /tmp/v29-B

      - name: C - used wrapper function
        continue-on-error: true
        run: |
          cp v29/main.cpp /tmp/v29-main.orig
          trap 'cp /tmp/v29-main.orig v29/main.cpp' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v29/main.cpp'); s=p.read_text()
          old='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n__attribute__((used))\n#endif\nstatic int v29_keep_inherited_main(){ return v27_embedded_main(); }\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v29/main.cpp -o /tmp/v29-C

      - name: D - unused pointer reference
        continue-on-error: true
        run: |
          cp v29/main.cpp /tmp/v29-main.orig
          trap 'cp /tmp/v29-main.orig v29/main.cpp' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v29/main.cpp'); s=p.read_text()
          old='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new='''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\nstatic int (*const v29_keep_v27_embedded_main)() __attribute__((unused)) = &v27_embedded_main;\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v29/main.cpp -o /tmp/v29-D

      - name: Diagnostic complete
        run: echo 'Inspect per-step conclusions for the first strict-portable fix that passes.'
