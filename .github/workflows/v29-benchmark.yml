name: v29 benchmark

on:
  push:
    branches: [v29-phased-evaluator]
    paths:
      - 'v29/**'
      - '.github/workflows/v29-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CPU capabilities
        run: lscpu
      - name: Run production full-training matrix
        run: python3 v29/benchmark/run_full_training.py --pairs 5 --threads 4 --output /tmp/v29-full-training.csv
      - name: Show results
        if: always()
        run: cat /tmp/v29-full-training.csv || true
