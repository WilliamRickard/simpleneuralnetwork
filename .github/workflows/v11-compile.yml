name: v11 compile validation

on:
  push:
    branches: [v11-relaxed-fp]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v11/main.cpp -o /tmp/simple_nn_v11_portable
      - name: Compile accelerated production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v11/main.cpp -lm -o /tmp/simple_nn_v11_accelerated
      - name: Compile benchmark harness
        run: g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -fopenmp v11/benchmark/bench_v11.cpp -lm -o /tmp/bench_v11
