name: v30 GN vector sigmoid screen

on:
  push:
    branches:
      - v30-profile
    paths:
      - '.github/workflows/v30-gn-vector-sigmoid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gn-vector-sigmoid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Require AVX-512F runner
        run: |
          if ! grep -qw avx512f /proc/cpuinfo; then exit 75; fi
          grep -m1 '^model name' /proc/cpuinfo || true

      - name: Patch and strict build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v30/benchmark/gn_candidate.cpp')
          s=p.read_text()
          old='    for(size_t j=0;j<HIDDEN_NODES;j++)hidden[j]=sigmoidV15(raw[j]);'
          new='    _mm512_store_pd(hidden,sigmoidVectorV17(_mm512_load_pd(raw)));\n    _mm512_store_pd(hidden+8,sigmoidVectorV17(_mm512_load_pd(raw+8)));'
          if old not in s: raise SystemExit('GN hidden sigmoid line not found')
          p.write_text(s.replace(old,new,1))
          PY
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
            -DSIMPLE_NN_USE_LIBMVEC v30/benchmark/gn_candidate.cpp -lmvec -o /tmp/v30-gn-vector

      - name: Exactness and timing
        env:
          OMP_PROC_BIND: 'true'
          OMP_PLACES: cores
          OMP_DYNAMIC: 'false'
        run: /tmp/v30-gn-vector 9 2
