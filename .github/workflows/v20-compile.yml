name: v20 compile

on:
  push:
    paths:
      - 'v20/**'
      - 'v19/**'
      - '.github/workflows/v20-compile.yml'
  pull_request:
    paths:
      - 'v20/**'
      - 'v19/**'
      - '.github/workflows/v20-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v20/main.cpp -o /tmp/v20-portable
      - name: Accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v20/main.cpp -lmvec -o /tmp/v20-accelerated
