name: v30 libmvec width exactness

on:
  push:
    branches:
      - v30-profile
    paths:
      - '.github/workflows/v30-libmvec-width-exactness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  width-exactness:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require AVX-512F runner
        run: |
          echo "slot=${{ matrix.slot }}"
          if ! grep -qw avx512f /proc/cpuinfo; then exit 75; fi
          grep -m1 '^model name' /proc/cpuinfo || true
          nm -D /lib/x86_64-linux-gnu/libmvec.so.1 | grep -E '_ZGV(dN4|eN8)v_exp@@' || true

      - name: Build differential checker
        run: |
          cat >/tmp/libmvec_width.cpp <<'CPP'
          #include <immintrin.h>
          #include <cstdint>
          #include <cstring>
          #include <iomanip>
          #include <iostream>
          #include <random>
          extern "C" __m512d _ZGVeN8v_exp(__m512d);
          extern "C" __m256d _ZGVdN4v_exp(__m256d);

          __attribute__((target("avx512f,avx512dq,avx2")))
          static __m512d exp4pair(__m512d x){
              const __m256d lo=_mm512_castpd512_pd256(x);
              const __m256d hi=_mm512_extractf64x4_pd(x,1);
              const __m256d elo=_ZGVdN4v_exp(lo);
              const __m256d ehi=_ZGVdN4v_exp(hi);
              __m512d r=_mm512_castpd256_pd512(elo);
              return _mm512_insertf64x4(r,ehi,1);
          }

          static uint64_t bits(double x){uint64_t u; std::memcpy(&u,&x,sizeof u); return u;}

          __attribute__((target("avx512f,avx512dq,avx2")))
          int main(){
              std::mt19937_64 rng(0x5a17f3d42c9bULL);
              std::uniform_real_distribution<double> common(-32.0,32.0);
              std::uniform_real_distribution<double> wide(-700.0,700.0);
              alignas(64) double in[8],a[8],b[8];
              uint64_t vectors=0;
              auto check=[&](bool useWide)->bool{
                  for(int q=0;q<8;q++) in[q]=useWide?wide(rng):common(rng);
                  const __m512d x=_mm512_load_pd(in);
                  _mm512_store_pd(a,_ZGVeN8v_exp(x));
                  _mm512_store_pd(b,exp4pair(x));
                  vectors++;
                  for(int q=0;q<8;q++) if(bits(a[q])!=bits(b[q])){
                      std::cout<<std::setprecision(17)
                               <<"MISMATCH vector="<<vectors<<" lane="<<q
                               <<" x="<<in[q]<<" exp8="<<a[q]<<" exp4pair="<<b[q]
                               <<" bits8=0x"<<std::hex<<bits(a[q])
                               <<" bits4=0x"<<bits(b[q])<<std::dec<<"\n";
                      return false;
                  }
                  return true;
              };
              for(uint64_t i=0;i<1000000;i++) if(!check(false)) return 3;
              for(uint64_t i=0;i<250000;i++) if(!check(true)) return 3;
              const double edges[]={-745.0,-744.0,-710.0,-709.0,-100.0,-32.0,-1.0,-0.0,0.0,1.0,32.0,100.0,709.0,710.0};
              for(size_t base=0;base<sizeof(edges)/sizeof(edges[0]);base+=8){
                  for(int q=0;q<8;q++) in[q]=edges[(base+q)%(sizeof(edges)/sizeof(edges[0]))];
                  const __m512d x=_mm512_load_pd(in);
                  _mm512_store_pd(a,_ZGVeN8v_exp(x));
                  _mm512_store_pd(b,exp4pair(x));
                  for(int q=0;q<8;q++) if(bits(a[q])!=bits(b[q])){
                      std::cout<<std::setprecision(17)<<"EDGE_MISMATCH lane="<<q<<" x="<<in[q]<<" exp8="<<a[q]<<" exp4pair="<<b[q]<<"\n";
                      return 4;
                  }
              }
              std::cout<<"PASS vectors="<<vectors<<" lanes="<<(vectors*8)<<" exact\n";
              return 0;
          }
          CPP
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror /tmp/libmvec_width.cpp -lmvec -o /tmp/libmvec_width

      - name: Run bitwise differential
        run: /tmp/libmvec_width
