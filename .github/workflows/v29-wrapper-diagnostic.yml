name: v29 wrapper diagnostic

# Shell-only: repository policy rejects external `uses:` actions.
on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - '.github/workflows/v29-wrapper-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Apply static-unused inherited-main wrapper in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v29/main.cpp')
          s = p.read_text()
          old = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#pragma GCC diagnostic ignored "-Wunused-function"\n#endif\n#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          new = '''#if defined(__GNUC__)\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored "-Wmisleading-indentation"\n#endif\n#define SIMPLE_NN_V28_NO_MAIN\n// v28 still embeds v27's old CLI main. Give that one inherited function\n// internal linkage and mark it unused so GCC can discard its legacy body.\n#define v27_embedded_main static __attribute__((unused)) v27_embedded_main\n#include "../v28/main.cpp"\n#undef v27_embedded_main\n#undef SIMPLE_NN_V28_NO_MAIN\n#if defined(__GNUC__)\n#pragma GCC diagnostic pop\n#endif\n'''
          if old not in s:
              raise SystemExit('expected v29 include prologue not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- v29/main.cpp

      - name: Strict portable C++11 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp v29/main.cpp -o /tmp/v29-portable >/tmp/v29-portable-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          log = Path('/tmp/v29-portable-build.log').read_text(errors='replace')
          if len(log) > 50000:
              log = log[-50000:]
          body = (
              'Automated v29 strict-portable diagnostic for commit `'
              + os.environ['GITHUB_SHA'] + '` failed. Compiler output:\n\n```text\n'
              + log + '\n```'
          )
          req = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues/37/comments',
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
            cat /tmp/v29-portable-build.log
            exit "$status"
          fi

      - name: Strict accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v29/main.cpp -lmvec -o /tmp/v29-accelerated

      - name: Portable smoke
        run: /tmp/v29-portable | tail -n 2

      - name: Accelerated smoke
        run: |
          if grep -qw avx512f /proc/cpuinfo; then
            /tmp/v29-accelerated | tail -n 2
          else
            echo 'SKIP accelerated smoke: runner lacks AVX-512F'
          fi

      - name: Production evaluator exactness benchmark
        run: |
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC \
            v29/benchmark/evaluator_exactness_benchmark.cpp -lmvec -o /tmp/v29-evaluator-exact
          /tmp/v29-evaluator-exact

      - name: Full training matrix
        env:
          OMP_PROC_BIND: 'true'
          OMP_PLACES: cores
          OMP_DYNAMIC: 'false'
        run: python3 v29/benchmark/run_full_training.py --pairs 7 --threads 2 --cooldown-ms 200 --output /tmp/v29-full-training.csv

      - name: Show matrix results
        if: always()
        run: |
          echo '--- v29 full training CSV ---'
          cat /tmp/v29-full-training.csv || true
          echo '--- end CSV ---'
