name: v29 wrapper diagnostic

# Shell-only: repository policy rejects external `uses:` actions.
on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - '.github/workflows/v29-wrapper-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Apply propagated no-main wrapper candidate in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          def guard_final_main(version):
              p = Path(f'v{version}/main.cpp')
              text = p.read_text()
              guard = f'SIMPLE_NN_V{version}_NO_MAIN'
              if f'#ifndef {guard}\nint main(){{' in text:
                  return
              needle = '\nint main(){\n'
              if needle not in text:
                  raise SystemExit(f'global main not found in v{version}/main.cpp')
              text = text.replace(needle, f'\n#ifndef {guard}\nint main(){{\n', 1)
              p.write_text(text.rstrip() + '\n#endif\n')

          guard_final_main(18)

          for version in range(19, 28):
              previous = version - 1
              replace_once(
                  f'v{version}/main.cpp',
                  f'#define main v{previous}_embedded_main\n#include "../v{previous}/main.cpp"\n#undef main',
                  f'#define SIMPLE_NN_V{previous}_NO_MAIN\n#include "../v{previous}/main.cpp"\n#undef SIMPLE_NN_V{previous}_NO_MAIN',
              )
              guard_final_main(version)

          replace_once(
              'v28/main.cpp',
              '#define main v27_embedded_main\n#include "../v27/main.cpp"\n#undef main',
              '#define SIMPLE_NN_V27_NO_MAIN\n#include "../v27/main.cpp"\n#undef SIMPLE_NN_V27_NO_MAIN',
          )
          replace_once(
              'v29/main.cpp',
              '#define main v28_embedded_main\n#include "../v28/main.cpp"\n#undef main',
              '#define SIMPLE_NN_V28_NO_MAIN\n#include "../v28/main.cpp"\n#undef SIMPLE_NN_V28_NO_MAIN',
          )
          PY
          git diff --check
          git diff --stat
          git diff -- v18/main.cpp v19/main.cpp v27/main.cpp v28/main.cpp v29/main.cpp

      - name: Strict portable C++11 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp v29/main.cpp -o /tmp/v29-portable >/tmp/v29-portable-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          log = Path('/tmp/v29-portable-build.log').read_bytes()
          diagnostic_path = f'.github/diagnostics/v29-portable-{os.environ["GITHUB_RUN_ID"]}.txt'
          payload = {
              'message': f'Capture v29 portable diagnostic run {os.environ["GITHUB_RUN_ID"]}',
              'content': base64.b64encode(log).decode('ascii'),
              'branch': os.environ['GITHUB_REF_NAME'],
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/' + diagnostic_path,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='PUT',
          )
          urllib.request.urlopen(request).read()
          print('Saved compiler diagnostic to ' + diagnostic_path)
          PY
            cat /tmp/v29-portable-build.log
            exit "$status"
          fi

      - name: Strict accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v29/main.cpp -lmvec -o /tmp/v29-accelerated

      - name: Backwards-compatible standalone strict builds
        run: |
          for version in 27 28; do
            g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp "v${version}/main.cpp" -o "/tmp/v${version}-portable"
            g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC "v${version}/main.cpp" -lmvec -o "/tmp/v${version}-accelerated"
          done

      - name: Portable smoke
        run: /tmp/v29-portable | tail -n 2

      - name: Accelerated smoke
        run: |
          if grep -qw avx512f /proc/cpuinfo; then
            /tmp/v29-accelerated | tail -n 2
          else
            echo 'SKIP accelerated smoke: runner lacks AVX-512F'
          fi

      - name: Production evaluator exactness benchmark
        run: |
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC \
            v29/benchmark/evaluator_exactness_benchmark.cpp -lmvec -o /tmp/v29-evaluator-exact
          /tmp/v29-evaluator-exact

      - name: Full training matrix
        env:
          OMP_PROC_BIND: 'true'
          OMP_PLACES: cores
          OMP_DYNAMIC: 'false'
        run: python3 v29/benchmark/run_full_training.py --pairs 7 --threads 2 --cooldown-ms 200 --output /tmp/v29-full-training.csv

      - name: Show matrix results
        if: always()
        run: |
          echo '--- v29 full training CSV ---'
          cat /tmp/v29-full-training.csv || true
          echo '--- end CSV ---'
