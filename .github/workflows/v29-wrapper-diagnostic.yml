name: v29 committed release gate

# Shell-only: repository policy rejects external `uses:` actions.
on:
  push:
    branches:
      - v29-phased-evaluator
    paths:
      - '.github/workflows/v29-wrapper-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_PROC_BIND: true
      OMP_PLACES: cores
      OMP_DYNAMIC: false
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git status --porcelain

      - name: Verify committed no-main include chain
        run: |
          python3 - <<'PY'
          from pathlib import Path

          v18 = Path('v18/main.cpp').read_text()
          if '#include<cstdint>\n#include<cstring>\n#include<ctime>' not in v18:
              raise SystemExit('v18 global standard-header boundary fix is missing')
          if '#ifndef SIMPLE_NN_V18_NO_MAIN\nint main(){' not in v18:
              raise SystemExit('v18 no-main guard is missing')

          for version in range(19, 28):
              previous = version - 1
              text = Path(f'v{version}/main.cpp').read_text()
              include = (
                  f'#define SIMPLE_NN_V{previous}_NO_MAIN\n'
                  f'#include "../v{previous}/main.cpp"\n'
                  f'#undef SIMPLE_NN_V{previous}_NO_MAIN'
              )
              if include not in text:
                  raise SystemExit(f'v{version} predecessor guard is missing')
              if f'#ifndef SIMPLE_NN_V{version}_NO_MAIN\nint main(){{' not in text:
                  raise SystemExit(f'v{version} own no-main guard is missing')

          for version in (28, 29):
              previous = version - 1
              text = Path(f'v{version}/main.cpp').read_text()
              include = (
                  f'#define SIMPLE_NN_V{previous}_NO_MAIN\n'
                  f'#include "../v{previous}/main.cpp"\n'
                  f'#undef SIMPLE_NN_V{previous}_NO_MAIN'
              )
              if include not in text:
                  raise SystemExit(f'v{version} predecessor guard is missing')

          if '#define main v' in ''.join(Path(f'v{v}/main.cpp').read_text() for v in range(18, 30)):
              raise SystemExit('legacy recursive main-renaming wrapper remains in v18-v29')
          PY
          test -z "$(git status --porcelain)"

      - name: Strict standalone compatibility builds v18-v29
        run: |
          for version in $(seq 18 29); do
            echo "strict portable v${version}"
            g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
              "v${version}/main.cpp" -o "/tmp/v${version}-portable"
            echo "strict accelerated v${version}"
            g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
              -DSIMPLE_NN_USE_LIBMVEC "v${version}/main.cpp" -lmvec \
              -o "/tmp/v${version}-accelerated"
          done

      - name: Build committed release harnesses
        run: |
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
            -DSIMPLE_NN_USE_LIBMVEC v29/benchmark/evaluator_exactness_benchmark.cpp \
            -lmvec -o /tmp/v29-evaluator-exact
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
            -DSIMPLE_NN_USE_LIBMVEC v29/benchmark/full_training_benchmark.cpp \
            -lmvec -o /tmp/v29-full-training
          sha256sum /tmp/v29-evaluator-exact /tmp/v29-full-training

      - name: Require AVX-512F release runner
        run: |
          if ! grep -qw avx512f /proc/cpuinfo; then
            echo 'Runner lacks AVX-512F; release execution was not attempted.' >&2
            exit 75
          fi
          grep -m1 '^model name' /proc/cpuinfo || true

      - name: Evaluator bit-exactness gate
        run: /tmp/v29-evaluator-exact

      - name: Full training release matrix
        run: |
          python3 v29/benchmark/run_full_training.py \
            --pairs 7 --threads 2 --cooldown-ms 200 \
            --output /tmp/v29-full-training.csv
          cat /tmp/v29-full-training.csv
