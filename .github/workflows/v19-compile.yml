name: v19 compile

on:
  pull_request:
    paths:
      - 'v19/**'
      - '.github/workflows/v19-compile.yml'
  push:
    paths:
      - 'v19/**'
      - '.github/workflows/v19-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 compile
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v19/main.cpp -o /tmp/v19-portable
      - name: Accelerated C++11 compile
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v19/main.cpp -lmvec -o /tmp/v19-accelerated
      - name: Diagnostic harness compile
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v19/benchmark/diagnose_v19.cpp -lmvec -o /tmp/v19-diagnose
