name: v30 GN all-size parameter-major screen

on:
  push:
    branches:
      - v30-profile
    paths:
      - '.github/workflows/v30-gn-parammajor-all.yml'
      - 'v30/benchmark/patch_gn_parammajor_all.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gn-parammajor-all:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_PROC_BIND: true
      OMP_PLACES: cores
      OMP_DYNAMIC: false
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Require AVX-512F runner
        run: |
          if ! grep -qw avx512f /proc/cpuinfo; then exit 75; fi
          grep -m1 '^model name' /proc/cpuinfo || true

      - name: Build baseline and all-size parameter-major candidate
        run: |
          common='-std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC'
          g++ $common v30/benchmark/gn_candidate.cpp -lmvec -o /tmp/gn-base
          python3 v30/benchmark/patch_gn_parammajor_all.py
          git diff --check
          g++ $common v30/benchmark/gn_candidate.cpp -lmvec -o /tmp/gn-parammajor-all
          sha256sum /tmp/gn-base /tmp/gn-parammajor-all

      - name: Exactness and isolated GN timing
        run: |
          echo 'BASE'
          /tmp/gn-base 11 2
          echo 'PARAMMAJOR_ALL'
          /tmp/gn-parammajor-all 11 2
