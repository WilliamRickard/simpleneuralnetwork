name: v23 compile

on:
  pull_request:
    paths:
      - 'v23/**'
      - 'v22/**'
      - '.github/workflows/v23-compile.yml'
  push:
    paths:
      - 'v23/**'
      - 'v22/**'
      - '.github/workflows/v23-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v23/main.cpp -o /tmp/v23-portable
      - name: Accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v23/main.cpp -lmvec -o /tmp/v23-accelerated
      - name: Benchmark harness compile
        run: g++ -std=c++11 -O3 -mavx2 -mfma -fopenmp -Wall -Wextra -Wpedantic -Werror v23/benchmark/scale_aware_gamma_benchmark.cpp -lmvec -o /tmp/v23-benchmark
