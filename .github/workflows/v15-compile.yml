name: v15 compile validation

on:
  push:
    branches: [v15-hybrid-lbfgs]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v15/main.cpp -o /tmp/simple_nn_v15_portable
      - name: Compile OpenMP production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp v15/main.cpp -o /tmp/simple_nn_v15_openmp
      - name: Compile benchmark harness
        run: g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -fopenmp v15/benchmark/bench_v15.cpp -o /tmp/bench_v15
