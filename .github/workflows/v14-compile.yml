name: v14 compile validation

on:
  push:
    branches: [v14-time-to-target]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v14/main.cpp -o /tmp/simple_nn_v14_portable
      - name: Compile accelerated production
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v14/main.cpp -lm -o /tmp/simple_nn_v14_accelerated
      - name: Compile benchmark harness
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v14/benchmark/bench_v14.cpp -o /tmp/bench_v14
