name: v25 compile

on:
  pull_request:
    paths:
      - 'v25/**'
      - 'v24/**'
      - '.github/workflows/v25-compile.yml'
  push:
    paths:
      - 'v25/**'
      - 'v24/**'
      - '.github/workflows/v25-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror v25/main.cpp -o /tmp/v25-portable
      - name: Accelerated C++11 build
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC v25/main.cpp -lmvec -o /tmp/v25-accelerated
