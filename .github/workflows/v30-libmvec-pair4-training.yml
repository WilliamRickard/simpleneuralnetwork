name: v30 paired-4-wide libmvec training screen

on:
  push:
    branches:
      - v30-profile
    paths:
      - '.github/workflows/v30-libmvec-pair4-training.yml'
      - 'v30/benchmark/libmvec_pair4_wrap.cpp'
      - 'v30/benchmark/codegen_v29.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair4-training:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_PROC_BIND: true
      OMP_PLACES: cores
      OMP_DYNAMIC: false
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Require AVX-512F runner
        run: |
          echo "slot=${{ matrix.slot }}"
          if ! grep -qw avx512f /proc/cpuinfo; then exit 75; fi
          grep -m1 '^model name' /proc/cpuinfo || true
          echo "nproc=$(nproc)"

      - name: Strict builds
        run: |
          common='-std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp -DSIMPLE_NN_USE_LIBMVEC'
          g++ $common v30/benchmark/codegen_v29.cpp -lmvec -o /tmp/p8
          g++ $common v30/benchmark/codegen_v29.cpp v30/benchmark/libmvec_pair4_wrap.cpp \
              -Wl,--wrap=_ZGVeN8v_exp -lmvec -o /tmp/p4
          sha256sum /tmp/p8 /tmp/p4

      - name: Exact alternating training screen
        run: |
          python3 - <<'PY'
          import statistics
          import subprocess
          import time

          cases=((5000,'0.0005'),(20000,'0.0005'),(100000,'0.0005'))
          for rows,target in cases:
              subprocess.check_output(['/tmp/p8',str(rows),target,'2','/tmp/sig8'],text=True)
              subprocess.check_output(['/tmp/p4',str(rows),target,'2','/tmp/sig4'],text=True)
              if open('/tmp/sig8','rb').read()!=open('/tmp/sig4','rb').read():
                  raise SystemExit(f'EXACTNESS FAIL rows={rows} target={target}')

              ratios=[]
              for pair in range(5):
                  record={}
                  order=('p8','p4') if pair%2==0 else ('p4','p8')
                  for name in order:
                      time.sleep(.2)
                      out=subprocess.check_output([
                          f'/tmp/{name}',str(rows),target,'2',f'/tmp/sig-{name}'
                      ],text=True).strip()
                      record[name]=float(out.split(',')[0])
                  if open('/tmp/sig-p8','rb').read()!=open('/tmp/sig-p4','rb').read():
                      raise SystemExit(f'PAIR EXACTNESS FAIL rows={rows} target={target}')
                  ratios.append(record['p8']/record['p4'])
              print(
                  f'PAIR4 rows={rows} target={target} '
                  f'median_speedup={statistics.median(ratios):.9f} '
                  f'wins={sum(x>1 for x in ratios)}/5 '
                  f'min={min(ratios):.9f} max={max(ratios):.9f}'
              )
          PY
