name: v30 physical-forward AVX burst

on:
  push:
    branches:
      - v30-profile
    paths:
      - '.github/workflows/v30-forward-physical-burst.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-forward:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OMP_PROC_BIND: true
      OMP_PLACES: cores
      OMP_DYNAMIC: false
    steps:
      - name: Checkout exact pushed commit
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Require AVX-512F runner
        run: |
          echo "slot=${{ matrix.slot }}"
          if ! grep -qw avx512f /proc/cpuinfo; then exit 75; fi
          grep -m1 '^model name' /proc/cpuinfo || true

      - name: Patch and strict build
        run: |
          python3 v30/benchmark/patch_forward_parallel.py
          python3 v30/benchmark/patch_forward_parallel_macros.py
          python3 v30/benchmark/patch_forward_wavefront.py
          git diff --check
          g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -Werror -fopenmp \
            -DSIMPLE_NN_USE_LIBMVEC v30/benchmark/full_training_benchmark.cpp \
            -lmvec -o /tmp/v30-forward-wavefront
          sha256sum /tmp/v30-forward-wavefront

      - name: Exact alternating training screen
        run: |
          python3 - <<'PY'
          import statistics
          import subprocess
          for rows,target in ((5000,'0.0005'),(20000,'0.0005'),(100000,'0.0005')):
              output=subprocess.check_output([
                  '/tmp/v30-forward-wavefront',str(rows),target,'5','2','200'
              ],text=True)
              records=[]
              for line in output.splitlines():
                  fields=line.split(',')
                  if len(fields)==9 and fields[0].isdigit(): records.append(fields)
              if len(records)!=5:
                  raise SystemExit(f'unexpected output rows={rows}:\n{output}')
              ratios=[float(r[7]) for r in records]
              updates={int(r[4]) for r in records}
              print(f'WAVEFRONT rows={rows} target={target} median_speedup={statistics.median(ratios):.9f} wins={sum(x>1 for x in ratios)}/5 updates={sorted(updates)} min={min(ratios):.9f} max={max(ratios):.9f}')
          PY
