name: v18 compile

on:
  pull_request:
    paths:
      - 'v18/**'
      - '.github/workflows/v18-compile.yml'
  push:
    paths:
      - 'v18/**'
      - '.github/workflows/v18-compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable C++11 compile
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic v18/main.cpp -o /tmp/v18-portable
      - name: Accelerated C++11 compile
        run: g++ -std=c++11 -O3 -Wall -Wextra -Wpedantic -fopenmp -DSIMPLE_NN_USE_LIBMVEC v18/main.cpp -lmvec -o /tmp/v18-accelerated
